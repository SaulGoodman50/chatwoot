# SDS patch: builds the patched Chatwoot image for our Railway deployment.
name: build-sds-image

on:
  push:
    branches: [sds-ghost-suggest]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Railway wijst naar een vaste tag; zonder unieke tag per build ziet het
      # geen nieuwe bron en blijft de oude image draaien.
      - id: tag
        run: echo "prod=prod-$(git rev-parse --short HEAD)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/saulgoodman50/chatwoot-sds:${{ steps.tag.outputs.prod }}
            ghcr.io/saulgoodman50/chatwoot-sds:4.16.0-ghost
            ghcr.io/saulgoodman50/chatwoot-sds:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "Railway image source → ghcr.io/saulgoodman50/chatwoot-sds:${{ steps.tag.outputs.prod }}" >> "$GITHUB_STEP_SUMMARY"

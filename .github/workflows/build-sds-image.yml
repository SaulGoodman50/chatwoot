# SDS patch: builds the patched Chatwoot image for our Railway deployment.
name: build-sds-image

on:
  push:
    branches: [sds-ghost-suggest]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/saulgoodman50/chatwoot-sds:4.16.0-ghost
            ghcr.io/saulgoodman50/chatwoot-sds:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
